
name: Generate stats card

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate stats.svg
        id: stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=ValiSanchezIng&hide_title=false&hide_rank=false&show_icons=true&include_all_commits=true&theme=dracula&locale=en&hide_border=false
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit stats.svg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg
          git commit -m "Update GitHub stats" || exit 0
          git push
